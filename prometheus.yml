global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'graphql-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['graphql-gateway:6060']

  - job_name: 'data-ingestor-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-ingestor-service:8080']

  - job_name: 'data-processor-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-processor-service:8080']

  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:2020']
