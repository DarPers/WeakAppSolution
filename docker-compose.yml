services:
  weak-app:
    build:
      context: .
      dockerfile: WeakApp/Dockerfile
    networks:
      - app_network
    container_name: weak-app
    ports:
      - "8080:8080"

  data-ingestor-service:
    build:
      context: .
      dockerfile: DataIngestorService/DataIngestorService/Dockerfile
    container_name: data-ingestor-service
    networks:
      - app_network
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8081:8080"
    depends_on:
      weak-app:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  data-processor-service:
    build:
      context: .
      args:
        - GITHUB_TOKEN=${NUGET_TOKEN}
      dockerfile: DataProcessorService/DataProcessorService/Dockerfile
    container_name: data-processor-service
    networks:
      - app_network
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      RabbitMQ__Password: guest
      ConnectionStrings__PostgresSQLConnectionString: Host=postgres;Port=5432;Database=WeakAppSolutionDb;Username=postgres;Password=1111
    ports:
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    networks:
      - app_network
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    networks:
      - app_network
    environment:
      POSTGRES_PASSWORD: 1111

  adminer:
    image: adminer
    restart: always
    networks:
      - app_network
    ports:
      - 5050:8080

  graphql-gateway:
    build:
      context: .
      dockerfile: GraphqlGateway/GraphqlGateway/Dockerfile
    container_name: graphql-gateway
    networks:
      - app_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=6060
    ports:
      - "6062:6060"
    depends_on:
      postgres:
        condition: service_started

  notification-service:
    build:
      context: .
      args:
        - GITHUB_TOKEN=${NUGET_TOKEN}
      dockerfile: NotificationService/NotificationService/Dockerfile
    container_name: notification-service
    networks:
      - app_network
    environment:
      - ASPNETCORE_HTTP_PORTS=2020
    ports:
      - "2000:2020"
    depends_on:
      rabbitmq:
        condition: service_healthy

  sensor-dashboard:
    build:
      context: ./sensor-dashboard-client
      dockerfile: Dockerfile
    container_name: sensor-dashboard
    networks:
      - app_network
    ports:
      - "5173:80"
    depends_on:
      - graphql-gateway
      - notification-service

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - app_network
    depends_on:
      - prometheus

networks:
  app_network:
    driver: bridge

