name: CI — Data Ingestor

on:
  pull_request:
    branches: [main]
    paths:
      - "DataIngestorService/**"
      - ".github/workflows/ci-ingestor.yml"
      - ".github/workflows/reusable-dotnet-ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-ingestor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingestor:
    uses: ./.github/workflows/reusable-dotnet-ci.yml
    with:
      working-directory: DataIngestorService
      project-file: DataIngestorService/DataIngestorService.csproj
      test-project: DataIngestorService.Tests/DataIngestorService.Tests.csproj
      dockerfile: DataIngestorService/Dockerfile
      image-name: data-ingestor-service
      dotnet-version: "10.0.x"
