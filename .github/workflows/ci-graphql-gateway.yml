name: CI — GraphQL Gateway

on:
  push:
    branches: [main]
    paths:
      - "GraphqlGateway/**"
      - ".github/workflows/ci-graphql-gateway.yml"
      - ".github/workflows/reusable-dotnet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "GraphqlGateway/**"
      - ".github/workflows/ci-graphql-gateway.yml"
      - ".github/workflows/reusable-dotnet-ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-graphql-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphql-gateway:
    uses: ./.github/workflows/reusable-dotnet-ci.yml
    with:
      working-directory: GraphqlGateway
      project-file: GraphqlGateway/GraphqlGateway.csproj
      test-project: GraphqlGateway.Tests/GraphqlGateway.Tests.csproj
      dockerfile: GraphqlGateway/GraphqlGateway/Dockerfile
      image-name: graphql-gateway
      dotnet-version: "10.0.x"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
