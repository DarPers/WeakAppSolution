name: CI — Data Ingestor

on:
  push:
    branches: [main]
    paths:
      - "DataIngestorService/**"
      - ".github/workflows/ci-data-ingestor.yml"
      - ".github/workflows/reusable-dotnet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "DataIngestorService/**"
      - ".github/workflows/ci-data-ingestor.yml"
      - ".github/workflows/reusable-dotnet-ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-data-ingestor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-ingestor:
    uses: ./.github/workflows/reusable-dotnet-ci.yml
    with:
      working-directory: DataIngestorService
      project-file: DataIngestorService.sln
      test-project: DataIngestorService.Tests/DataIngestorService.Tests.csproj
      dockerfile: DataIngestorService/DataIngestorService/Dockerfile
      image-name: data-ingestor-service
      sonar-project-key: WeakAppSolution_DataIngestorService
      dotnet-version: "10.0.x"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
