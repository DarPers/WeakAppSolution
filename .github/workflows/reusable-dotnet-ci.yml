name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Service directory for dotnet CLI (cwd)
        required: true
        type: string
      project-file:
        description: Relative path to the main .csproj (from working-directory)
        required: true
        type: string
      test-project:
        description: Relative path to a test project (from working-directory). Empty = auto-discover.
        required: false
        type: string
        default: ""
      dockerfile:
        description: Dockerfile path from repository root
        required: true
        type: string
      image-name:
        description: Docker image name (without tag)
        required: true
        type: string
      dotnet-version:
        description: .NET SDK version
        required: false
        type: string
        default: "10.0.x"

permissions:
  contents: read
  checks: write
  statuses: write
  packages: read

jobs:
  ci:
    name: Restore → Build → Test → Lint → Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GITHUB_TOKEN: ${{ secrets.NUGET_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore "${{ inputs.project-file }}"

      - name: Build
        run: dotnet build "${{ inputs.project-file }}" --configuration Release --no-restore

      - name: Test
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.test-project }}" ]; then
            echo "Running tests: ${{ inputs.test-project }}"
            dotnet test "${{ inputs.test-project }}" --configuration Release --verbosity normal
          else
            mapfile -t TEST_PROJECTS < <(find . -type f \( -name '*Tests*.csproj' -o -name '*Test*.csproj' \) | sort)
            if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
              echo "No test projects found under ${{ inputs.working-directory }}; skipping tests."
            else
              for proj in "${TEST_PROJECTS[@]}"; do
                echo "Running tests: $proj"
                dotnet test "$proj" --configuration Release --verbosity normal
              done
            fi
          fi

      - name: Lint
        run: dotnet format "${{ inputs.project-file }}" --verify-no-changes --verbosity diagnostic

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ${{ inputs.image-name }}:ci-${{ github.sha }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.NUGET_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
