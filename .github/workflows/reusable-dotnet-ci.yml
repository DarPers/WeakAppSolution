name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Service directory used for relative project paths
        required: true
        type: string
      project-file:
        description: Path to .csproj or .sln relative to working-directory
        required: true
        type: string
      test-project:
        description: Path to test project relative to working-directory (empty = auto-discover)
        required: false
        type: string
        default: ""
      dockerfile:
        description: Dockerfile path relative to repository root
        required: true
        type: string
      image-name:
        description: Docker image name (without tag)
        required: true
        type: string
      dotnet-version:
        description: .NET SDK version
        required: false
        type: string
        default: "10.0.x"
      needs-nuget-auth:
        description: Whether restore needs GitHub Packages credentials
        required: false
        type: boolean
        default: false
      skip-tests:
        description: Skip unit tests
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      SONAR_ORGANIZATION:
        required: false
      SONAR_PROJECT_KEY:
        required: false
      NUGET_TOKEN:
        required: false

jobs:
  ci:
    name: Build · Test · Sonar · Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GITHUB_TOKEN: ${{ secrets.NUGET_TOKEN != '' && secrets.NUGET_TOKEN || github.token }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL != '' && secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY != '' && secrets.SONAR_PROJECT_KEY || 'WeakAppSolution' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.csproj', inputs.working-directory)) }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Require NuGet token for private feeds
        if: ${{ inputs.needs-nuget-auth }}
        run: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN / NUGET_TOKEN is required to restore private GitHub Packages." >&2
            exit 1
          fi
        working-directory: .

      - name: Install SonarScanner for .NET
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' }}
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        id: sonar_begin
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          set -euo pipefail
          # begin/build/end must share the same working directory
          dotnet sonarscanner begin \
            "/k:${SONAR_PROJECT_KEY}" \
            "/o:${SONAR_ORGANIZATION}" \
            "/d:sonar.token=${SONAR_TOKEN}" \
            "/d:sonar.host.url=${SONAR_HOST_URL}" \
            "/d:sonar.cs.opencover.reportsPaths=${{ github.workspace }}/**/coverage.opencover.xml" \
            "/d:sonar.coverage.exclusions=**/Program.cs,**/*Migrations*/**" \
            "/d:sonar.exclusions=**/bin/**,**/obj/**,**/*.Tests/**"

      - name: Restore
        run: dotnet restore "${{ inputs.project-file }}"

      - name: Build (static analyzers + code style)
        run: |
          dotnet build "${{ inputs.project-file }}" \
            --configuration Release \
            --no-restore \
            /p:EnforceCodeStyleInBuild=true \
            /p:RunAnalyzersDuringBuild=true

      - name: Unit tests
        if: ${{ !inputs.skip-tests }}
        run: |
          set -euo pipefail
          COLLECT='XPlat Code Coverage;Format=opencover'
          RESULTS="${{ github.workspace }}/TestResults"
          mkdir -p "$RESULTS"

          run_test() {
            local proj="$1"
            echo "Running tests: $proj"
            dotnet test "$proj" \
              --configuration Release \
              --verbosity normal \
              --collect:"$COLLECT" \
              --results-directory "$RESULTS"
          }

          if [ -n "${{ inputs.test-project }}" ]; then
            run_test "${{ inputs.test-project }}"
          else
            mapfile -t TEST_PROJECTS < <(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) | sort)
            if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
              echo "No test projects found under ${{ inputs.working-directory }}; skipping tests."
            else
              for proj in "${TEST_PROJECTS[@]}"; do
                run_test "$proj"
              done
            fi
          fi

      - name: End SonarCloud analysis
        if: ${{ always() && steps.sonar_begin.outcome == 'success' }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Set up Docker Buildx
        if: ${{ success() }}
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        if: ${{ success() }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ${{ inputs.image-name }}:ci-${{ github.sha }}
          build-args: |
            GITHUB_TOKEN=${{ env.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
